# Docker Compose for linting, formatting, and testing
version: '3.8'

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: netbox-geo-dev
    environment:
      - SECRET_KEY=test-secret-key
      - DATABASE_URL=sqlite+aiosqlite:///:memory:
      - REDIS_URL=redis://localhost:6379/0
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml

  lint:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: netbox-geo-lint
    command: ruff check src tests
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml

  format-check:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: netbox-geo-format-check
    command: ruff format --check src tests
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml

  format:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: netbox-geo-format
    command: ruff format src tests
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: netbox-geo-test
    environment:
      - SECRET_KEY=test-secret-key
      - DATABASE_URL=sqlite+aiosqlite:///:memory:
      - REDIS_URL=redis://localhost:6379/0
    command: >
      python -m pytest tests/ -v
        --cov=netbox_geo
        --cov-report=term-missing
        --cov-report=xml:coverage.xml
        --cov-report=html:htmlcov
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml