# Docker multi-stage CI/CD pipeline
# Stages: lint → test → build → push → deploy
#
# Every gate runs inside the 'ci' Docker image so local and CI environments
# are identical.  The production image is built and pushed only on main/tags.
name: Docker CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  PYTHON_VERSION: "3.12"

jobs:

  # ── Stage 1: code quality ───────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3

      - name: Build ci stage (cached)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          target: ci
          load: true
          tags: netbox-geo:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max

      - name: Run lint
        run: |
          docker compose -f docker-compose.ci.yml run --rm lint

  # ── Stage 2: tests ──────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3

      - name: Restore ci image from cache
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          target: ci
          load: true
          tags: netbox-geo:ci
          cache-from: type=gha,scope=ci

      - name: Run tests
        env:
          NETBOX_URL: https://demo.netbox.dev
          NETBOX_TOKEN: ci-placeholder
          GEONAMES_USERNAME: ci-test
        run: |
          mkdir -p reports
          docker compose -f docker-compose.ci.yml run --rm \
            -v ${{ github.workspace }}/reports:/app/reports \
            test

      - name: Upload test results
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        if: always()
        with:
          name: test-results
          path: |
            reports/junit.xml
            reports/coverage.xml
            reports/htmlcov/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0f8570b1a125f4937846a11fcfa3bcd548bd8c97 # v4
        with:
          file: reports/coverage.xml
          fail_ci_if_error: false

  # ── Stage 3: build production image ─────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_tags: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push production image
        id: push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: |
            type=gha,scope=ci
            type=gha,scope=production
          cache-to: type=gha,scope=production,mode=max

  # ── Stage 4: deploy (main branch only) ───────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
    strategy:
      matrix:
        environment: [staging, production]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Deploy to ${{ matrix.environment }}
        run: |
          echo "Deploying ${{ needs.build.outputs.image_tags }} to ${{ matrix.environment }}"
          # Hook: run ansible, kubectl, or docker compose on target host
          # ansible-playbook -i ansible/inventories/${{ matrix.environment }}/hosts.yml \
          #     ansible/playbooks/deploy.yml \
          #     -e "image_tag=${{ needs.build.outputs.image_digest }}"
