name: NetBox Geo CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Build dev image
        run: docker compose -f docker-compose.test.yml build dev

      - name: Run ruff lint
        run: docker compose -f docker-compose.test.yml run --rm lint

      - name: Run ruff format check
        run: docker compose -f docker-compose.test.yml run --rm format-check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Build dev image
        run: docker compose -f docker-compose.test.yml build dev

      - name: Run tests
        run: docker compose -f docker-compose.test.yml run --rm test

      - name: Upload coverage report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        if: always()
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml

  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Build dev image
        run: docker compose -f docker-compose.test.yml build dev

      - name: Run Bandit
        run: docker compose -f docker-compose.test.yml run --rm dev bandit -r src -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: security-reports
          path: bandit-report.json

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Build production Docker image
        run: docker build -t netbox-geo:${{ github.sha }} .
