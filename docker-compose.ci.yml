# Docker Compose CI pipeline
# Builds the 'ci' stage and runs each gate (lint / test / build-check) as a
# separate service so they share a single cached image build.
#
# Usage (local):
#   docker compose -f docker-compose.ci.yml run --rm lint
#   docker compose -f docker-compose.ci.yml run --rm test
#   docker compose -f docker-compose.ci.yml run --rm build-check
#
# Usage (GitHub Actions / GitLab CI):
#   docker compose -f docker-compose.ci.yml run --rm lint
#   docker compose -f docker-compose.ci.yml run --rm test
version: '3.9'

x-ci-base: &ci-base
  build:
    context: .
    target: ci
    cache_from:
      - type=registry,ref=ghcr.io/${GITHUB_REPOSITORY:-nullroute-commits/netbox-geo-foss}:ci-cache
  image: netbox-geo:ci
  environment:
    - CI=true
    # Minimal env so unit tests don't need a live NetBox
    - NETBOX_URL=${NETBOX_URL:-https://demo.netbox.dev}
    - NETBOX_TOKEN=${NETBOX_TOKEN:-ci-placeholder}
    - GEONAMES_USERNAME=${GEONAMES_USERNAME:-ci-test}

services:

  # ── Code quality gate ─────────────────────────────────────────────────────
  lint:
    <<: *ci-base
    command: >
      sh -c "
        echo '==> black' && black --check src tests &&
        echo '==> flake8' && flake8 src tests &&
        echo '==> isort' && isort --check-only src tests &&
        echo '==> mypy' && mypy src
      "

  # ── Unit + integration test gate ─────────────────────────────────────────
  test:
    <<: *ci-base
    command: >
      pytest
        --cov=netbox_geo
        --cov-report=xml:reports/coverage.xml
        --cov-report=term-missing
        --junitxml=reports/junit.xml
        -v
    volumes:
      - ./reports:/app/reports

  # ── Production image smoke test ───────────────────────────────────────────
  build-check:
    build:
      context: .
      target: production
    image: netbox-geo:latest
    command: netbox-geo --help

volumes: {}
