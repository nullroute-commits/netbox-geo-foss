# GitLab CI/CD Pipeline – NetBox Geo FOSS
# Stages: build → lint → test → security → package → deploy → cleanup
stages:
  - build
  - lint
  - test
  - security
  - package
  - deploy
  - cleanup

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  IMAGE: $CI_REGISTRY_IMAGE
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# ── Reusable anchors ───────────────────────────────────────────────────────────
.docker: &docker
  services:
    - docker:dind
  before_script:
    - docker info
    - docker compose version

.python: &python
  image: python:3.12-slim
  cache:
    key: "$CI_COMMIT_REF_SLUG-pip"
    paths:
      - .cache/pip

# ── Stage 1: build the ci image and export it as an artifact ──────────────────
build:ci-image:
  stage: build
  <<: *docker
  script:
    - docker build --target ci --tag netbox-geo:ci .
    - docker save netbox-geo:ci | gzip > netbox-geo-ci.tar.gz
  artifacts:
    paths:
      - netbox-geo-ci.tar.gz
    expire_in: 1 hour

build:prod-image:
  stage: build
  <<: *docker
  script:
    - docker build --target production --tag netbox-geo:latest .
    - docker save netbox-geo:latest | gzip > netbox-geo-latest.tar.gz
  artifacts:
    paths:
      - netbox-geo-latest.tar.gz
    expire_in: 1 hour

# ── Stage 2: lint (inside the ci image) ───────────────────────────────────────
lint:code:
  stage: lint
  <<: *docker
  needs: [build:ci-image]
  script:
    - docker load < netbox-geo-ci.tar.gz
    - docker compose -f docker-compose.ci.yml run --rm lint

# ── Stage 3: tests ────────────────────────────────────────────────────────────
test:unit:
  stage: test
  <<: *docker
  needs: [build:ci-image]
  script:
    - docker load < netbox-geo-ci.tar.gz
    - mkdir -p reports
    - |
      docker compose -f docker-compose.ci.yml run --rm \
        -v $CI_PROJECT_DIR/reports:/app/reports \
        test unit
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml
    paths:
      - reports/
    expire_in: 1 week

test:integration:
  stage: test
  <<: *docker
  needs: [test:unit]
  script:
    - docker load < netbox-geo-ci.tar.gz
    - mkdir -p reports
    - |
      docker compose -f docker-compose.ci.yml run --rm \
        -v $CI_PROJECT_DIR/reports:/app/reports \
        test integration
  artifacts:
    when: always
    paths:
      - reports/
    expire_in: 1 week

# ── Stage 4: security ─────────────────────────────────────────────────────────
security:code:
  stage: security
  <<: *python
  needs: [lint:code]
  before_script:
    - pip install bandit safety
  script:
    - bandit -r src -f json -o bandit-report.json || true
    - safety check -r requirements/base.txt --json --output safety-report.json || true
  artifacts:
    reports:
      sast: bandit-report.json
    paths:
      - "*-report.json"
    expire_in: 1 month

security:container:
  stage: security
  <<: *docker
  needs: [build:prod-image]
  script:
    - docker load < netbox-geo-latest.tar.gz
    - |
      docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v $CI_PROJECT_DIR:/src \
        aquasec/trivy:latest image \
        --format json \
        --output /src/trivy-report.json \
        netbox-geo:latest || true
  artifacts:
    reports:
      container_scanning: trivy-report.json
    paths:
      - trivy-report.json
    expire_in: 1 month

# ── Stage 5: package (push to registry) ───────────────────────────────────────
package:push:
  stage: package
  <<: *docker
  needs: [test:unit, security:code, security:container]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/
    - if: $CI_COMMIT_TAG
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker load < netbox-geo-latest.tar.gz
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG="$CI_COMMIT_TAG"
        docker tag netbox-geo:latest $IMAGE:$TAG
        docker tag netbox-geo:latest $IMAGE:latest
        docker push $IMAGE:$TAG
        docker push $IMAGE:latest
      else
        TAG="$CI_COMMIT_REF_SLUG"
        docker tag netbox-geo:latest $IMAGE:$TAG
        docker push $IMAGE:$TAG
      fi

# ── Stage 6: deploy ───────────────────────────────────────────────────────────
.deploy-base:
  stage: deploy
  image: alpine/ansible:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - |
      ansible-playbook \
        -i ansible/inventories/$ENVIRONMENT/hosts.yml \
        ansible/playbooks/deploy.yml \
        -e "app_version=$CI_COMMIT_SHA" \
        -e "environment=$ENVIRONMENT" \
        -e "registry_url=$IMAGE"

deploy:staging:
  extends: .deploy-base
  needs: [package:push]
  environment:
    name: staging
    url: https://staging.example.com
  variables:
    ENVIRONMENT: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy:production:
  extends: .deploy-base
  needs: [deploy:staging]
  environment:
    name: production
    url: https://example.com
  variables:
    ENVIRONMENT: prod
  rules:
    - if: $CI_COMMIT_TAG
  when: manual

# ── Stage 7: cleanup ──────────────────────────────────────────────────────────
cleanup:docker:
  stage: cleanup
  <<: *docker
  when: always
  script:
    - docker compose -f docker-compose.ci.yml down -v || true
    - docker system prune -af --volumes || true
  allow_failure: true
