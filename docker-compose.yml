# Local development – mounts source for hot-reload
# Usage: docker compose up
version: '3.9'

services:
  app:
    build:
      context: .
      target: ci
    image: netbox-geo:dev
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./cache:/app/cache
    env_file:
      - .env
    command: netbox-geo --help
